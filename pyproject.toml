[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keturah"
version = "0.4.0"
description = "Keturah — a uniform, MCP-bridgeable manifest of a product's LLM-consumable interfaces."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "gellsmore-svg"}]
keywords = ["llm", "mcp", "tools", "interface", "manifest", "capabilities", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
# Dependency-free: the manifest shape is pure stdlib so any product can adopt it.
dependencies = []

[project.urls]
Homepage = "https://github.com/gellsmore-svg/keturah"
Repository = "https://github.com/gellsmore-svg/keturah"
Issues = "https://github.com/gellsmore-svg/keturah/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
keturah-mcp = "keturah.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keturah = ["py.typed"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set explicitly rather than inheriting ruff's defaults: ruff 0.16
# widened those defaults, which silently turns a green gate red on a tool
# upgrade. This is the historical default set (pyflakes + the pycodestyle
# errors worth gating), so the gate means the same thing on every ruff version.
select = ["E4", "E7", "E9", "F"]
